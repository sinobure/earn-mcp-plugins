name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - exchange-rate-mcp
          - notion-lite-mcp
          - time-mcp
          - rss-mcp
          - markdown-to-pdf-mcp

    name: "${{ matrix.plugin }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "${{ matrix.plugin }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.plugin }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.plugin }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.plugin }}
        run: npm test

      - name: Dry-run publish check
        working-directory: ${{ matrix.plugin }}
        run: npm publish --dry-run --access public
